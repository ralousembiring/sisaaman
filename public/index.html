<div id="toastRoot"></div>
<script>
(() => {
'use strict';
const KEY='sisaaman_v2_empty_start';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const rupiah=n=>'Rp'+Math.round(Number(n)||0).toLocaleString('id-ID');
const parseMoney=v=>Math.max(0,Number(String(v??'').replace(/[^\d.-]/g,''))||0);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const plusDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateFormat=s=>{if(!s)return '—';const d=new Date(s+'T12:00:00');return Number.isNaN(d.valueOf())?s:d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})};
const currentMonth=()=>today().slice(0,7);
const defaultState=()=>({version:2,profile:{name:'',email:'',openingBalance:0,nextPayday:'',currency:'IDR'},transactions:[],bills:[],goals:[],settings:{monthlySavingGoal:0,privacyTip:true}});
let state;
try{const raw=localStorage.getItem(KEY);state=raw?JSON.parse(raw):defaultState();if(!state.profile||!Array.isArray(state.transactions)||!Array.isArray(state.goals))state=defaultState()}catch(e){state=defaultState()}
let view='dashboard',txFilter='all',goalFilter='target',txFormOpen=false,goalFormOpen=false,settingsTab='account',simPrice=0,simDays=10,simUseTarget='';
let calcDisplayValue='0',calcStoredValue=null,calcPendingOperator=null,calcReplaceDisplay=true;
function calcFormat(value){return Number(value||0).toLocaleString('id-ID',{maximumFractionDigits:0})}
function calcRender(){const display=$('#calcDisplay'),expression=$('#calcExpression');if(display)display.textContent=calcFormat(calcDisplayValue);if(expression){expression.textContent=calcPendingOperator&&calcStoredValue!==null?`${calcFormat(calcStoredValue)} ${calcPendingOperator}`:'Hitung nominal transaksi';}}
function calcClear(){calcDisplayValue='0';calcStoredValue=null;calcPendingOperator=null;calcReplaceDisplay=true;calcRender()}
function calcApplyOperator(a,op,b){if(op==='+')return a+b;if(op==='−')return a-b;if(op==='×')return a*b;if(op==='÷')return b===0?null:a/b;return b}
function calcPress(kind,value){
  if(kind==='clear'){calcClear();return}
  if(kind==='digit'||kind==='triple-zero'){
    const incoming=kind==='triple-zero'?'000':String(value);
    if(calcReplaceDisplay){calcDisplayValue=incoming.replace(/^0+(?=\d)/,'')||'0';calcReplaceDisplay=false}
    else if(String(calcDisplayValue).length<15)calcDisplayValue=(String(calcDisplayValue)==='0'?'':String(calcDisplayValue))+incoming;
    calcDisplayValue=String(Math.max(0,Number(calcDisplayValue)||0));calcRender();return;
  }
  if(kind==='backspace'){
    calcDisplayValue=calcReplaceDisplay?'0':(String(calcDisplayValue).length>1?String(calcDisplayValue).slice(0,-1):'0');calcReplaceDisplay=false;calcRender();return;
  }
  if(kind==='operator'){
    const current=Number(calcDisplayValue)||0;
    if(calcPendingOperator&&calcStoredValue!==null&&!calcReplaceDisplay){
      const result=calcApplyOperator(calcStoredValue,calcPendingOperator,current);
      if(result===null||!Number.isFinite(result)){toast('Tidak bisa membagi dengan nol.',true);calcClear();return}
      calcDisplayValue=String(Math.round(result));
    }
    calcStoredValue=Number(calcDisplayValue)||0;calcPendingOperator=value;calcReplaceDisplay=true;calcRender();return;
  }
  if(kind==='equals'&&calcPendingOperator&&calcStoredValue!==null){
    const result=calcApplyOperator(calcStoredValue,calcPendingOperator,Number(calcDisplayValue)||0);
    if(result===null||!Number.isFinite(result)){toast('Tidak bisa membagi dengan nol.',true);calcClear();return}
    calcDisplayValue=String(Math.max(0,Math.round(result)));calcStoredValue=null;calcPendingOperator=null;calcReplaceDisplay=true;calcRender();
  }
}

const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('Browser tidak dapat menyimpan data. Periksa pengaturan penyimpanan.',true);return false}};

<div class="footer">SisaAman · Bantu kamu memahami catatan keuangan, bukan mengelola uang secara langsung.</div>`}

="button" data-calc="digit" data-value="3">3</button><button type="button" class="calc-operator" data-calc="equals">=</button><button type="button" data-calc="digit" data-value="0">0</button><button type="button" data-calc="triple-zero">000</button><button type="button" class="calc-operator" data-calc="operator" data-value="+">+ lagi</button><button type="button" class="calc-clear" data-calc="clear">AC</button></div><button type="button" class="btn btn-primary calculator-use" data-action="use-calculator-result">Gunakan hasil untuk nominal</button></div></div><div class="field"><label for="txCategory">Kategori</label><select id="txCategory" name="category"><option>Makan & Minum</option><option>Transportasi</option><option>Tagihan</option><option>Belanja</option><option>Kesehatan</option><option>Hiburan</option><option>Pendidikan</option><option>Lainnya</option><option>Gaji</option><option>Freelance</option><option>Bonus</option><option>Investasi</option></select></div><div class="field"><label for="txDate">Tanggal</label><input id="txDate" name="date" type="date" value="${today()}" required></div><div class="field full"><label for="txNote">Keterangan</label><input id="txNote" name="note" maxlength="100" placeholder="Contoh: makan siang atau gaji bulanan"></div></div><div class="form-actions"><button type="button" class="btn btn-light" data-action="close-tx">Batal</button><button type="submit" class="btn btn-primary">Simpan transaksi</button></div></form></div>`}
function transactions(){let items=[...state.transactions].sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(txFilter==='income'||txFilter==='expense')items=items.filter(x=>x.type===txFilter);else if(txFilter==='month')items=items.filter(isMonth);const inc=sum(state.transactions.filter(x=>x.type==='income'),x=>x.amount),exp=sum(state.transactions.filter(x=>x.type==='expense'),x=>x.amount);return `${pageHead('RIWAYAT UANG','Transaksi','Catat uang masuk dan keluar supaya gambaran keuangan tetap jelas.',`<button class="btn btn-primary" data-action="open-tx">＋ Tambah transaksi</button>`)}${txFormOpen?transactionForm():''}<div class="grid grid-even section-gap" style="margin-bottom:18px"><div class="card metric" style="--accent:#def7e9"><div class="metric-top"><span class="metric-label">Total pemasukan tercatat</span><span class="metric-icon">↙</span></div><div class="metric-value positive">${fmt(inc)}</div></div><div class="card metric" style="--accent:#fff0df"><div class="metric-top"><span class="metric-label">Total pengeluaran tercatat</span><span class="metric-icon">↗</span></div><div class="metric-value warning">${fmt(exp)}</div></div></div><div class="card"><div class="filters"><button class="filter ${txFilter==='all'?'active':''}" data-filter="all">Semua</button><button class="filter ${txFilter==='income'?'active':''}" data-filter="income">Pemasukan</button><button class="filter ${txFilter==='expense'?'active':''}" data-filter="expense">Pengeluaran</button><button class="filter ${txFilter==='month'?'active':''}" data-filter="month">Bulan ini</button></div><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Transaksi</th><th>Jenis</th><th>Nominal</th><th>Aksi</th></tr></thead><tbody>${txRows(items)}</tbody></table></div><div class="note" style="margin-top:14px">Saldo akan dihitung dari saldo awal ditambah pemasukan dan dikurangi pengeluaran. Menghapus transaksi akan memperbarui hitungan.</div></div><div class="footer">Catatan transaksi disimpan di bro function simulation(){const t=totals(),price=Math.max(0,simPrice),after=t.flexible-price,dailyBefore=t.flexible/t.dayLeft,dailyAfter=after/t.dayLeft;const goal=state.goals.find(g=>g.id===simUseTarget);const goalImpact=goal?Math.max(0,goal.target-goal.saved):0;return `${pageHead('SEBELUM MEMBELI','Simulasi pembelian','Coba hitung dampak pembelian sebelum memutuskan, tanpa mengubah catatan asli.')}<div class="sim-layout"><section class="card"><div class="card-head"><div><h2>Rencana pembelian</h2><p>Atur skenario untuk melihat dampak anggaran.</p></div><span class="metric-icon">🧮</span></div><form id="simForm"><div class="form-grid"><div class="field full"><label for="simPrice">Harga barang yang ingin dibeli (Rp)</label><input id="simPrice" name="price" type="number" min="0" value="${esc(simPrice)}" required></div><div class="field full"><label for="simDays">Hari sampai pemasukan berikutnya</label><input id="simDays" name="days" type="range" min="1" max="45" value="${simDays}" oninput="document.getElementById('daysValue').textContent=this.value+' hari'"><div class="hint" id="daysValue">${simDays} hari</div></div><div class="field full"><label for="simGoal">Target yang ingin diperhatikan (opsional)</label><select id="simGoal" name="goal"><option value="">Tidak memilih target tertentu</option>${state.goals.filter(g=>g.kind==='target').map(g=>`<option value="${esc(g.id)}" ${g.id===simUseTarget?'selected':''}>${esc(g.name)} · sisa ${fmt(Math.max(0,g.target-g.saved))}</option>`).join('')}</select></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">Hitung simulasi ↗</button></div></form><div class="note" style="margin-top:14px">Simulasi ini tidak mencatat pembelian atau mengubah saldo. Catatan transaksi baru dibuat jika  menambahkannya secara manual.</div></section><section class="card"><div class="card-head"><div><h2>Hasil simulasi</h2><p>Hitungan berdasarkan catatan saat ini.</p></div></div><div class="sim-result"><h3>Perkiraan dana fleksibel setelah pembelian</h3><div class="big" style="color:${after<0?'var(--red)':'var(--green)'}">${fmt(after)}</div><div class="muted" style="font-size:11px">Sebelum pembelian: ${fmt(t.flexible)}</div></div><div class="result-tiles"><div class="result-tile"><small>Batas per hari sebelum</small><b>${fmt(dailyBefore)}</b></div><div class="result-tile"><small>Batas per hari sesudah</small><b style="color:${dailyAfter<0?'var(--red)':'var(--green)'}">${fmt(dailyAfter)}</b></div><div class="result-tile"><small>Harga pembelian</small><b>${fmt(price)}</b></div><div class="result-tile"><small>Hari dihitung</small><b>${simDays} hari</b></div></div>${after<0?`<div class="note" style="margin-top:14px;background:#fff5f3;border-color:#f7d8d2;color:#a14c40">⚠️ Pembelian ini melebihi dana fleksibel yang tercatat. Pertimbangkan mengubah waktu atau rencana, dan pastikan saldo serta tagihan sudah benar.</div>`:`<div class="note" style="margin-top:14px">${price===0?'Masukkan harga barang untuk membandingkan skenario.':`Setelah pembelian hipotetis, rata-rata dana fleksibel menjadi ${fmt(dailyAfter)} per hari untuk ${simDays} hari. Pastikan kebutuhan lain tetap terpenuhi.`}</div>`}${goal?`<div class="sim-result" style="margin-top:12px;background:#fff9e9;border-color:#fae7b9"><h3>Target yang dipilih: ${esc(goal.name)}</h3><div class="muted" style="font-size:12px">Saat ini masih membutuhkan ${fmt(goalImpact)}. Simulasi ini tidak memotong alokasi target, karena sumber uang pembelian belum dipilih.</div></div>`:''}</section></div>`}
function reports(){const months=[];const now=new Date();for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,label:d.toLocaleDateString('id-ID',{month:'short'}),income:0,expense:0})}state.transactions.forEach(t=>{const m=months.find(m=>m.key===(t.date||'').slice(0,7));if(m)m[t.type==='income'?'income':'expense']+=+t.amount||0});const max=Math.max(1,...months.flatMap(m=>[m.income,m.expense]));const t=totals();const txThis=state.transactions.filter(isMonth);return `${pageHead('GAMBARAN KEUANGAN','Laporan','Lihat arus pemasukan dan pengeluaran dari catatan yang sudah kamu masukkan.')}<div class="grid grid-four"><div class="card metric" style="--accent:#e0f6e9"><div class="metric-top"><span class="metric-label">Pemasukan bulan ini</span><span class="metric-icon">↙</span></div><div class="metric-value positive">${fmt(sum(txThis.filter(x=>x.type==='income'),x=>x.amount))}</div></div><div class="card metric" style="--accent:#fff0df"><div class="metric-top"><span class="metric-label">Pengeluaran bulan ini</span><span class="metric-icon">↗</span></div><div class="metric-value warning">${fmt(sum(txThis.filter(x=>x.type==='expense'),x=>x.amount))}</div></div><div class="card metric" style="--accent:#e8efff"><div class="metric-top"><span class="metric-label">Selisih bulan ini</span><span class="metric-icon">≈</span></div><div class="metric-value">${fmt(sum(txThis.filter(x=>x.type==='income'),x=>x.amount)-sum(txThis.filter(x=>x.type==='expense'),x=>x.amount))}</div></div><div class="card metric" style="--accent:#f0e8ff"><div class="metric-top"><span class="metric-label">Rencana tabungan</span><span class="metric-icon">◎</span></div><div class="metric-value">${fmt(state.settings.monthlySavingGoal||0)}</div></div></div><section class="card section-gap"><div class="card-head"><div><h2>Arus uang · 6 bulan terakhir</h2><p>Perbandingan pemasukan dan pengeluaran yang tercatat</p></div><div style="display:flex;gap:12px;font-size:10px"><span style="color:var(--green)">● Pemasukan</span><span style="color:var(--orange)">● Pengeluaran</span></div></div>${state.transactions.length?`<div class="bar-chart">${months.map(m=>`<div class="bar-col"><span class="bar-value">${m.income||m.expense?`${Math.round(Math.max(m.income,m.expense)/100000)/10}jt`:''}</span><div style="height:calc(100% - 28px);display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center"><div class="bar" title="Pemasukan ${fmt(m.income)}" style="height:${m.income/max*100}%;background:linear-gradient(180deg,#49c99a,#087f5b)"></div><div class="bar" title="Pengeluaran ${fmt(m.expense)}" style="height:${m.expense/max*100}%;background:linear-gradient(180deg,#ffd38b,#d97706)"></div></div><span class="bar-label">${m.label}</span></div>`).join('')}</div>`:empty('📊','Belum ada riwayat untuk digrafikkan','Grafik akan terisi setelah kamu mencatat pemasukan atau pengeluaran.')}</section><section class="card section-gap"><div class="card-head"><div><h2>Rincian berdasarkan kategori</h2><p>Pengeluaran bulan ini</p></div></div>${(()=>{const ex=txThis.filter(x=>x.type==='expense');const total=sum(ex,x=>x.amount);const groups={};ex.forEach(x=>groups[x.category]=(groups[x.category]||0)+(+x.amount||0));const entries=Object.entries(groups).sort((a,b)=>b[1]-a[1]);return entries.length?entries.map(([name,amount])=>`<div style="margin:13px 0"><div class="target-row"><span style="font-size:12px;font-weight:700">${iconFor(name)} ${esc(name)}</span><span style="font-size:12px;font-weight:750">${fmt(amount)}</span></div><div class="progress"><span style="width:${total?amount/total*100:0}%;background:#e6a048"></span></div><div class="target-meta"><span>${total?Math.round(amount/total*100):0}% dari pengeluaran</span></div></div>`).join(''):empty('📊','Belum ada data','Catat transaksi pengeluaran untuk melihat rincian kategori.')})()}</section><div class="form-actions"><button class="btn btn-light" data-action="export-csv">↓ Ekspor transaksi CSV</button></div><div class="footer">Laporan bersumber dari transaksi yang ada di browser ini.</div>`}
function settings(){return `${pageHead('PREFERENSI','Pengaturan','Kelola profil dan rencana dasar SisaAman.')}<div class="settings-layout"><div class="settings-nav"><button class="${settingsTab==='account'?'active':''}" data-settings-tab="account">Profil & anggaran</button><button class="${settingsTab==='privacy'?'active':''}" data-settings-tab="privacy">Data & privasi</button></div><section class="card">${settingsTab==='account'?`<div class="card-head"><div><h2>Informasi dasar</h2><p>Digunakan untuk menghitung ringkasan, bukan untuk transaksi bank.</p></div></div><form id="settingsForm"><div class="form-grid"><div class="field"><label for="profileName">Nama panggilan</label><input name="name" id="profileName" maxlength="70" value="${esc(state.profile.name)}" required></div><div class="field"><label for="profileEmail">Email (opsional)</label><input name="email" id="profileEmail" type="email" maxlength="120" value="${esc(state.profile.email||'')}" placeholder="nama@email.com"></div><div class="field"><label for="openingBalance">Saldo awal (Rp)</label><input name="openingBalance" id="openingBalance" type="number" min="0" value="${esc(state.profile.openingBalance||0)}" required><span class="hint">Isi saldo sebelum transaksi yang tercatat di aplikasi.</span></div><div class="field"><label for="nextPayday">Tanggal pemasukan berikutnya</label><input name="nextPayday" id="nextPayday" type="date" value="${esc(state.profile.nextPayday||'')}" required></div><div class="field"><label for="savingGoal">Target tabungan bulanan (Rp)</label><input name="savingGoal" id="savingGoal" type="number" min="0" value="${esc(state.settings.monthlySavingGoal||0)}" required></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">Simpan pengaturan</button></div></form>`:`<div class="card-head"><div><h2>Data dan privasi</h2><p>Prototype menyimpan informasi di penyimpanan lokal browser.</p></div></div><div class="note">🔒 Data transaksi dan profil disimpan di browser pada perangkat ini melalui localStorage. Belum ada server, sinkronisasi antarperangkat, enkripsi aplikasi khusus, atau pencadangan otomatis. Jangan gunakan data keuangan sangat sensitif pada prototipe ini.</div><div class="form-actions" style="justify-content:flex-start"><button class="btn btn-light" data-action="export-json">↓ Cadangkan data JSON</button><button class="btn btn-light" data-action="import-json">↑ Pulihkan data JSON</button><input type="file" id="importFile" accept="application/json,.json" class="hidden"></div><div class="danger-box section-gap"><h3>Mulai ulang prototipe</h3><p>Menghapus seluruh catatan yang tersimpan di browser ini dan mengembalikan aplikasi ke kondisi kosong. Ekspor cadangan terlebih dahulu jika masih dibutuhkan.</p><button class="btn btn-danger btn-sm" data-action="reset-data">Hapus semua catatan</button></div>`}</section></div><div class="footer">Versi prototipe lokal · Belum menggunakan akun atau database server.</div>`}
function render(){const c=$('#content');const map={dashboard,transactions,goals,simulation,reports,settings};c.innerHTML=(map[view]||dashboard)();$('#crumbName').textContent=viewNames[view]||'Beranda';$('#todayLabel').textContent=new Date().toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'});const nm=state.profile.name||'Pengguna SisaAman';$('#sideName').textContent=nm;$('#avatarInitial').textContent=nm.trim().charAt(0).toUpperCase()||'S';$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
function csvEscape(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportCSV(){const rows=[['Tanggal','Jenis','Kategori','Keterangan','Nominal'],...state.transactions.map(t=>[t.date,t.type==='income'?'Pemasukan':'Pengeluaran',t.category,t.note,t.amount])];download('sisaaman-transaksi.csv','\ufeff'+rows.map(r=>r.map(csvEscape).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('File CSV berhasil disiapkan.')}
function exportJSON(){download('sisaaman-cadangan.json',JSON.stringify(state,null,2),'application/json');toast('Cadangan JSON berhasil disiapkan.')}
function addTransaction(form){const fd=new FormData(form);const amount=parseMoney(fd.get('amount'));if(amount<=0){toast('Nominal harus lebih dari nol.',true);return}state.transactions.push({id:crypto.randomUUID(),date:fd.get('date')||today(),type:fd.get('type')==='income'?'income':'expense',category:fd.get('category')||'Lainnya',note:String(fd.get('note')||'').trim().slice(0,100),amount});persist();txFormOpen=false;render();toast('Transaksi berhasil dicatat.')}
function addGoal(form){const fd=new FormData(form);const target=parseMoney(fd.get('target')),saved=parseMoney(fd.get('saved'));if(!String(fd.get('name')||'').trim()||target<=0){toast('Nama dan target harus diisi dengan benar.',true);return}const kind=fd.get('kind')==='wishlist'?'wishlist':'target';const g={id:crypto.randomUUID(),name:String(fd.get('name')).trim().slice(0,70),emoji:fd.get('emoji')||'🎯',kind,target,saved:kind==='wishlist'?0:Math.min(saved,target),dueDate:fd.get('dueDate')||'',priority:'Sedang'};state.goals.push(g);persist();goalFormOpen=false;goalFilter=kind;render();toast('Impian baru berhasil ditambahkan.')}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){setView(nav.dataset.view);return}const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action,id=b.dataset.id;if(act==='toggle-calculator'){const panel=$('#txCalculator');if(panel){const opening=panel.classList.contains('hidden');panel.classList.toggle('hidden');b.setAttribute('aria-expanded',String(opening));if(opening)calcRender()}return}else if(act==='use-calculator-result'){const amount=Math.round(Number(calcDisplayValue)||0);if(amount<=0){toast('Hasil kalkulator harus lebih dari nol.',true);return}const input=$('#txAmount');if(input){input.value=amount;$('#txCalculator')?.classList.add('hidden');$('.calculator-toggle')?.setAttribute('aria-expanded','false');input.focus();toast('Hasil kalkulator dimasukkan ke nominal.')}return}else if(act==='open-tx'){view='transactions';txFormOpen=true;goalFormOpen=false;render();window.scrollTo({top:0,behavior:'smooth'});$('#txAmount')?.focus()}else if(act==='close-tx'){txFormOpen=false;render()}else if(act==='open-goal'){view='goals';goalFormOpen=true;txFormOpen=false;render();window.scrollTo({top:0,behavior:'smooth'});$('#gName')?.focus()}else if(act==='close-goal'){goalFormOpen=false;render()}else if(act==='delete-tx'){const t=state.transactions.find(x=>x.id===id);if(t&&confirm(`Hapus transaksi ${t.note||t.category} senilai ${fmt(t.amount)}?`)){state.transactions=state.transactions.filter(x=>x.id!==id);persist();render();toast('Transaksi dihapus.')}}else if(act==='delete-goal'){const g=state.goals.find(x=>x.id===id);if(g&&confirm(`Hapus impian "${g.name}"?`)){state.goals=state.goals.filter(x=>x.id!==id);persist();render();toast('Impian dihapus.')}}else if(act==='add-saved'){const g=state.goals.find(x=>x.id===id);if(!g)return;const amount=prompt(`Tambahkan alokasi untuk ${g.name}.\nSisa target: ${fmt(Math.max(0,g.target-g.saved))}\n\nMasukkan nominal (Rp):`);if(amount===null)return;const n=parseMoney(amount);if(n<=0){toast('Nominal harus lebih dari nol.',true);return}const t=totals();if(n>Math.max(0,t.flexible)){toast('Nominal melebihi dana fleksibel yang tercatat. Periksa kembali saldo dan kewajiban.',true);return}g.saved=Math.min(g.target,g.saved+n);persist();render();toast('Alokasi target diperbarui. Catatan saldo fisik tidak berubah.')}else if(act==='make-target'){const g=state.goals.find(x=>x.id===id);if(g){g.kind='target';g.priority=g.priority||'Sedang';persist();goalFilter='target';render();toast('Wishlist diubah menjadi target tabungan.')}}else if(act==='simulate-goal'){const g=state.goals.find(x=>x.id===id);if(g){simUseTarget=g.kind==='target'?g.id:'';simPrice=Math.max(0,g.target-g.saved);setView('simulation')}}else if(act==='export-csv'){exportCSV()}else if(act==='export-json'){exportJSON()}else if(act==='import-json'){$('#importFile')?.click()}else if(act==='reset-data'){if(confirm('Yakin menghapus seluruh catatan SisaAman di browser ini? Tindakan ini tidak bisa dibatalkan tanpa cadangan.')){state=defaultState();persist();view='dashboard';txFilter='all';goalFilter='target';render();toast('Semua catatan lokal telah dihapus. SisaAman kembali kosong.')}}});
document.addEventListener('click',e=>{const key=e.target.closest('[data-calc]');if(!key)return;calcPress(key.dataset.calc,key.dataset.value||'');});
document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){txFilter=f.dataset.filter;render()}const gf=e.target.closest('[data-goal-filter]');if(gf){goalFilter=gf.dataset.goalFilter;render()}const st=e.target.closest('[data-settings-tab]');if(st){settingsTab=st.dataset.settingsTab;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='txForm'){e.preventDefault();addTransaction(e.target)}else if(e.target.id==='goalForm'){e.preventDefault();addGoal(e.target)}else if(e.target.id==='settingsForm'){e.preventDefault();const fd=new FormData(e.target);state.profile.name=String(fd.get('name')||'Pengguna SisaAman').trim();state.profile.email=String(fd.get('email')||'').trim();state.profile.openingBalance=parseMoney(fd.get('openingBalance'));state.profile.nextPayday=fd.get('nextPayday')||plusDays(1);state.settings.monthlySavingGoal=parseMoney(fd.get('savingGoal'));persist();render();toast('Pengaturan berhasil disimpan.')}else if(e.target.id==='simForm'){e.preventDefault();const fd=new FormData(e.target);simPrice=parseMoney(fd.get('price'));simDays=Math.max(1,Math.min(45,Number(fd.get('days'))||10));simUseTarget=fd.get('goal')||'';render();toast('Simulasi diperbarui; catatan asli tidak berubah.')}});
document.addEventListener('change',async e=>{if(!e.target || e.target.id!=='importFile')return;const file=e.target.files?.[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!parsed.profile||!Array.isArray(parsed.transactions)||!Array.isArray(parsed.goals)||!Array.isArray(parsed.bills))throw new Error('Format tidak cocok');if(!confirm('Pulihkan cadangan ini? Data SisaAman saat ini akan diganti.'))return;state=parsed;state.settings=state.settings||{monthlySavingGoal:0};persist();render();toast('Cadangan berhasil dipulihkan.')}catch(err){toast('File tidak valid atau bukan cadangan SisaAman.',true)}finally{e.target.value=''}});
render();
})();
</script>
</body>
</html>
